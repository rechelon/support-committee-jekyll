---
layout: default
---
<main class="post-page">
  <div class="post-page__inner wrap">

    {% include sidebar-nav.html current=page.url %}

    <article class="post-content post-content--post">
      <h1>{{ page.title }}</h1>
      <p class="post-content__date">{{ page.date | date: "%b %d, %Y" }}</p>
      {{ content }}
    </article>

  </div>
</main>
