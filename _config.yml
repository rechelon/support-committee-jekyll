# =====================================================================
# Support Committee Theme — site settings
# =====================================================================
# This is the only file most committees should need to edit. Almost
# every section below is OPTIONAL: leave a value blank, remove it, or
# set it to false, and the corresponding box/section on the site will
# just not render — nothing breaks. Look for "optional" in the
# comments to know what's safe to delete.
# =====================================================================

title: "Support EXAMPLE"
description: "Support committee for EXAMPLE, facing federal charges connected to grand jury subpoenas targeting local mutual aid networks."

# Must match one of the keys under color_schemes at the bottom of this
# file. See that section for the full list of options.
color_scheme: dark_forest

url: ""        # e.g. "https://supportexample.org" — leave blank for GitHub Pages default
baseurl: ""    # e.g. "/supportexample" if publishing to a project subpage on GitHub Pages

# -----------------------------------------------------------------
# Hero photo — shown full-width at the top of the front page, and
# smaller in the corner of every other page. Leave `photo` blank to
# hide it everywhere (the title banner still shows on its own).
# -----------------------------------------------------------------
photo: /assets/images/example.jpg
photo_alt: "Portrait of EXAMPLE"

# -----------------------------------------------------------------
# Optional urgent-alert stamp, overlaid on the bottom-right corner of
# the hero photo. Leave alert.line1 blank to hide it. This is meant
# for short-lived urgent items (hunger strike, upcoming hearing, call-in
# campaign) — swap the text in and out as needed, there's no dynamic
# expiration logic.
# -----------------------------------------------------------------
alert:
  line1: "Hunger Strike"
  line2: "Calls Needed"

# -----------------------------------------------------------------
# Case summary page (case-summary.md). Optional — if you don't want a
# separate page for this, set to false. When false, the "Learn more
# about the case" banner CTA and its nav-menu entry are both hidden,
# leaving just the site title in the banner.
# -----------------------------------------------------------------
case_summary_page: true

# -----------------------------------------------------------------
# Bio. bio.md holds the full page; this is just the short teaser shown
# in the box on the front page. Bio is the one page in this theme that
# isn't optional — every committee needs at least a short bio.
# -----------------------------------------------------------------
bio_teaser: >
  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
  eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim
  ad minim veniam, quis nostrud exercitation ullamco laboris.

# -----------------------------------------------------------------
# Non-cooperating co-defendants. Optional and probably irrelevant for
# most cases — leave the list empty (codefendants: []) or delete the
# key to hide the box entirely. Each entry just needs a name + a URL
# to link out to (their own support site, a court records page, etc).
# -----------------------------------------------------------------
codefendants:
  - name: "Marc Smith"
    url: "https://example.com"
  - name: "DNC 17 Committee"
    url: "https://example.com"

# -----------------------------------------------------------------
# Mail / letter-writing. The /send-a-letter/ page always exists (like
# bio) regardless of what's set here. The front-page box mirroring
# this content is optional though — if mail.address is blank, that
# box is hidden. rules, topics, and statement are each independently
# optional within it.
# -----------------------------------------------------------------
mail:
  address: |
    EXAMPLE #00123-456
    FCI Example
    PO Box 1000
    Example, ST 00000
  rules:
    - "Include your full return address or mail may be rejected."
    - "Blue or black ink only — no markers, glitter, or stickers."
    - "Photos okay (no polaroids, no glossy paper)."
    - "No stamps, cash, or metal/spiral-bound items."
  topics:
    - "Gardening"
    - "Sci-Fi"
    - "Chess"
    - "Prison Abolition"
    - "Music Zines"
    - "Dogs"
  statement: "Send me memes from social media you like, transcribe your favorite poem — anything that reminds you of the outside."

# -----------------------------------------------------------------
# Donate box. Optional as a whole — if every field below is blank,
# the box is hidden. Each donation method is independently optional.
# -----------------------------------------------------------------
donate:
  blurb: "Every dollar goes directly to phone time, commissary, and legal costs. No amount is too small."
  donation_embed: ""   # optional — paste any HTML embed snippet (a real PayPal button, Donorbox, GiveButter, etc) and it renders as-is
  paypal_email: "give@example.org"
  venmo: "@ExampleSupport"
  cashapp: "$ExampleSupport"
  zelle: ""
  bitcoin: "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh"
  gofundme_url: ""
  commissary_service: "Access Corrections"   # whatever service the facility uses (JPay, TouchPay, etc)
  commissary_instructions: ""                 # e.g. a facility code or account number
  amazon_wishlist_url: ""

# -----------------------------------------------------------------
# Social icons, shown in the footer in this fixed order regardless of
# which are filled in: Instagram, Mastodon, Bluesky, Twitter/X,
# Facebook. Leave any blank to hide just that one icon.
# -----------------------------------------------------------------
social:
  instagram: ""
  mastodon: ""
  bluesky: ""
  twitter: ""
  facebook: ""

contact_email: "supportexample@riseup.net"   # optional — hides the "Write:" footer line if blank

# -----------------------------------------------------------------
# "Our friends" footer links — optional list of allied orgs (ABC
# chapters, NLG, SPLC, etc). Leave empty to hide the line.
# -----------------------------------------------------------------
friends:
  - name: "ABC No Rio"
    url: "https://example.com"
  - name: "SPLC"
    url: "https://example.com"
  - name: "NLG"
    url: "https://example.com"

# How many post previews show on the front page on desktop. Mobile
# always shows 3 regardless of this number, matching the design.
front_page_post_count: 5

# =====================================================================
# COLOR SCHEMES
# =====================================================================
# Set color_scheme above to any key below. Each scheme supplies the 10
# base color tokens; a few schemes also need to override one or two of
# the derived "component" colors (see the "overrides" comment in
# assets/css/style.css for what these do) — those live under
# `overrides` and are optional per-scheme.
#
# To add a brand new scheme: copy a block, give it a new key, and set
# color_scheme to that key. No CSS or template changes needed.
# =====================================================================
color_schemes:
