# =====================================================================
# Jekyll / build settings — committees shouldn't need to touch these.
# =====================================================================
markdown: kramdown
permalink: /:title/
plugins:
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
